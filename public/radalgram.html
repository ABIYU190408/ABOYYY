<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pemuktahiran PK — Dashboard</title>
  <link rel="stylesheet" href="assets/css/index.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <!-- ...existing code... -->
 <style>
    /* Minimal styles hanya untuk layout halaman, navbar, panel report dan iframe responsive */

    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: #f7fafc;
      color: #0f1724;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .wrap {
      display: flex;
      min-height: 100vh;
      gap: 20px;
      box-sizing: border-box;
    }

    /* Sidebar placeholder (component akan mengisi isinya) */
    #sidebar {
      width: 260px;
      min-width: 220px;
      box-sizing: border-box;
    }

    main.main {
      flex: 1;
      padding: 22px;
      box-sizing: border-box;
    }

    /* Navbar sederhana */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: center;
      /* centered horizontally */
      gap: 12px;
      padding: 12px 16px;
      background-color: rgb(32, 85, 139);
      box-shadow: 0 4px 18px rgba(2, 92, 134, 0.675);
      border-radius: 24px;
      margin-bottom: 20px;
      border-right: 4px solid rgba(4, 3, 72, 0.564);
      border-bottom: 4px solid rgba(4, 3, 72, 0.564);
    }

    .navbar > div {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      text-align: center;
    }

 /* Centered, larger report panel */
    .panel.report-panel {
      max-width: 1100px;
      margin: 32px auto;
      /* center horizontally + ruang atas/bawah */
      padding: 24px;
      /* ruang dalam yang lebih lega */
      border-radius: 24px;
      background-color: rgb(70, 135, 200);
      box-shadow: 90PX 10px 40px rgba(0, 0, 0, 0.06);
      border: 2px solid rgb(59, 107, 202);
      overflow: hidden;
      border-bottom: 4px solid rgba(4, 3, 72, 0.564);
      border-right: 4px solid rgba(4, 3, 72, 0.564);;
    }

    /* Responsive iframe with larger minimum height */
    .iframe-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      /* 16:9 aspect ratio */
      min-height: 520px;
      /* lebih besar pada layar lebar */
      height: 0;
      overflow: hidden;
      border-radius: 24px;
      /* background: linear-gradient(135deg, rgba(233, 235, 241, 0.573) 0%, rgb(236, 237, 239) 100%); */
      background-color: #e6eef8;
      border: 2px solid rgba(5, 93, 112, 0.608);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.738);
    }

    .iframe-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    footer {
      margin-top: 18px;
      text-align: center;
      color: rgba(0,0,0,0.6);
      font-size: 13px;
    }

    /* Responsive tweaks */
    @media (max-width: 720px) {
      .wrap {
        flex-direction: column;
      }

      #sidebar {
        width: 100%;
        min-width: auto;
      }

      main.main {
        padding: 12px;
      }

      .panel.report-panel {
        margin: 16px;
        padding: 12px;
      }

      .iframe-wrapper {
        min-height: 260px;
        padding-bottom: 56.25%;
      }
    }

    @media (min-width: 1400px) {
      .panel.report-panel {
        max-width: 1300px;
      }
      .iframe-wrapper {
        min-height: 720px;
        padding-bottom: 50%;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div id="sidebar"></div>

    <script type="module">
      import { loadsidebar } from './components/sidebar.js';
      loadsidebar();
    </script>

    <main class="main">
      <div class="navbar">
        <div>
          <strong style="font-size: 30px; color: #e6eef8;">Pemuktahiran PK</strong><br><small class="small"
            style="font-size: 15px; color: #e6eef8;">Tambah dan kelola pemuktahiran</small>

        </div>
      </div>

      <!-- improved section -->
      <section class="panel report-panel">
        <div class="iframe-wrapper">
          <iframe width="600" height="338"
            src="https://lookerstudio.google.com/embed/reporting/ae3b68ea-c8c0-41aa-8f50-c9ce3e9610dc/page/p_ona1jh7gqd"
            frameborder="0" style="border:0" allowfullscreen
            sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
        </div>
      </section>

      <footer>
        &copy;.2025 Pemuktahiran PK.
      </footer>
    </main>
  </div>
</body>

</html>
